# The reMarkable Paper Pro. These are the same values as layout::Device::PAPER_PRO (src/layout.rs).
# The file has KEY=VALUE lines only: the shell scripts load it (device-lib.sh) and the Python scripts read it.
PHYS_W=1620           # the physical screen in portrait, px
PHYS_H=2160
DPI=229               # the density that the PNG files record
C=147                 # the side of a board cell, px
PAGE_SCALE=1.153846   # the screen px of one layout unit of the manual and the analytics pages
TB_SLOT=112           # the side of a toolbar slot, px
COMPACT_CARD=0        # 1: the result card has the compact layout of a small screen

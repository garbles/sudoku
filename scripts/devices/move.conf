# The reMarkable Paper Pro Move. These are the same values as layout::Device::MOVE (src/layout.rs).
# The file has KEY=VALUE lines only: the shell scripts load it (device-lib.sh) and the Python scripts read it.
PHYS_W=954            # the physical screen in portrait, px
PHYS_H=1696
DPI=264               # the density that the PNG files record
C=78                  # the side of a board cell, px
PAGE_SCALE=0.679487   # the screen px of one layout unit of the manual and the analytics pages (954 / 1404)
TB_SLOT=96            # the side of a toolbar slot, px
COMPACT_CARD=1        # 1: the result card has the compact layout of a small screen

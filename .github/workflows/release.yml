# Builds the app and makes a GitHub release with the AppLoad folder (sudoku-<version>.tar.gz),
# version.json and version.json.sig. version.json gives the version, the download URL and the SHA-256
# checksum of the archive. version.json.sig is the ed25519 signature of version.json with the private
# key in the secret SUDOKU_SIGNING_KEY (PEM). The app installs an update only with a correct signature
# (REQUIREMENTS.md §9.2). A stable release fails without the secret.
#
# - build.yml calls this workflow after each push to main. The result is the prerelease `pre-<sha>`.
# - A manual run (workflow_dispatch) on main makes the stable release `v<version>`, with the version
#   of Cargo.toml. If this tag is already on GitHub, the run fails. Increase the version first, or
#   set the input `replace`: the run then deletes the old release and its tag, after the new build
#   passes all tests. Only one stable run can operate at a time.
name: Release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the release v<version> if it is already on GitHub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    # In a called workflow, github.event_name is the event of the caller (push).
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'release-stable' || format('release-pre-{0}', github.sha) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' }}
      # Empty for a call from build.yml, because that call has no inputs.
      REPLACE: ${{ inputs.replace == true }}
    steps:
      - name: Stable releases only from main
        if: env.STABLE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start the stable release from the main branch."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the stable version
        if: env.STABLE == 'true'
        id: stable
        run: |
          # tomllib is the TOML parser of the Python standard library (Python 3.11 and later).
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          echo "version=v$cargo_version" >> "$GITHUB_OUTPUT"
          echo "Version: v$cargo_version"

      # The tag of each release has the name of the release. An API error stops the run.
      - name: Make sure that the stable version is new
        if: env.STABLE == 'true'
        id: tag
        env:
          VERSION: ${{ steps.stable.outputs.version }}
        run: |
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" --jq '.[].ref')"
          if grep -qx "refs/tags/$VERSION" <<< "$tags"; then
            if [ "$REPLACE" = true ]; then
              echo "::warning::The tag $VERSION is already on GitHub. The run replaces it."
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::The tag $VERSION is already on GitHub. Increase the version in Cargo.toml, or set the input replace."
              exit 1
            fi
          fi

      - name: Find the version
        id: version
        env:
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
        run: |
          if [ "$STABLE" = true ]; then
            version="$STABLE_VERSION"
          else
            version="pre-${GITHUB_SHA::7}"
            if gh release view "$version" > /dev/null 2>&1; then
              echo "::notice::The release $version is already on GitHub."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        if: steps.version.outputs.exists != 'true'
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.exists != 'true'

      # The Dockerfile runs all tests before it makes dist/sudoku/. The cache keeps the compiled
      # dependencies between runs.
      - name: Test and build
        if: steps.version.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=dist
          build-args: SUDOKU_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

      - name: Make the release
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.SUDOKU_SIGNING_KEY }}
          REPLACE_OLD: ${{ steps.tag.outputs.replace }}
        run: |
          archive="sudoku-$VERSION.tar.gz"
          tar -C dist -czf "$archive" sudoku
          sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION/$archive"
          jq -n --arg version "$VERSION" --arg url "$url" --arg sha256 "$sha256" \
            '{version: $version, url: $url, sha256: $sha256}' > version.json
          cat version.json
          files=("$archive" version.json)
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/signing-key.pem"
            (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
            openssl pkeyutl -sign -inkey "$key" -rawin -in version.json -out version.json.sig
            rm -f "$key"
            files+=(version.json.sig)
          elif [ "$STABLE" = true ]; then
            echo "::error::The secret SUDOKU_SIGNING_KEY is not set. A stable release must have version.json.sig."
            exit 1
          else
            echo "::warning::The secret SUDOKU_SIGNING_KEY is not set. The prerelease has no version.json.sig."
          fi
          # Delete the old release only now, after the new build passes all tests.
          if [ "$REPLACE_OLD" = true ]; then
            if gh release view "$VERSION" > /dev/null 2>&1; then
              gh release delete "$VERSION" --cleanup-tag --yes
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
            fi
          fi
          if [ "$STABLE" = true ]; then kind=--latest; else kind=--prerelease; fi
          gh release create "$VERSION" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes "$kind"

# Tests, builds and releases the app for the reMarkable Paper Pro. One workflow, two events:
#
# - A push to main makes the prerelease `pre-<sha>` (a preview version).
# - A manual run (workflow_dispatch) on main makes the stable release `v<version>`, with the version
#   of Cargo.toml. If this tag is already on GitHub, the run fails. Increase the version first, or
#   set the input `replace`: the run then deletes the old release and its tag, after the new build
#   passes all tests. Only one stable run can operate at a time.
#
# The jobs version, media, test and build run in parallel (build starts after version). The job
# release starts only when all of them pass:
#
# 1. version: finds the name of the release and makes sure that a stable version is new.
# 2. media: Dockerfile.images, Dockerfile.installer and Dockerfile.video make the images, the
#    AppLoad icon and the demo videos again (one job for each Dockerfile). They must be the same as
#    the files in git.
# 3. test: Dockerfile.test runs all tests on aarch64 Linux (musl). The release tests and the debug
#    tests are two jobs.
# 4. build: the Dockerfile builds the AppLoad folder dist/sudoku/ with the version of the release.
# 5. release: makes a GitHub release with the AppLoad folder (sudoku-<version>.tar.gz), the ink patch
#    (sudoku-penregion.qmd, not in the archive), version.json, version.json.sig and install.sh.
#    install.sh has the version, the checksum of the archive and the checksum of the patch of its
#    release. version.json gives the version, the download URL and the SHA-256 checksum of the
#    archive, and the download URL and the SHA-256 checksum of the patch. version.json.sig is the ed25519 signature of version.json with the private key in the
#    secret SUDOKU_SIGNING_KEY (PEM). The app installs an update only with a correct signature
#    (REQUIREMENTS.md §9.2). A stable release fails without the secret.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the release v<version> if it is already on GitHub
        type: boolean
        default: false

permissions:
  contents: read

# A new push to main cancels the run of an older push. A manual run is never canceled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
      replace: ${{ steps.tag.outputs.replace }}
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' }}
      # False for a push, because a push has no inputs.
      REPLACE: ${{ inputs.replace == true }}
    steps:
      - name: Stable releases only from main
        if: env.STABLE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start the stable release from the main branch."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the stable version
        if: env.STABLE == 'true'
        id: stable
        run: |
          # tomllib is the TOML parser of the Python standard library (Python 3.11 and later).
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          echo "version=v$cargo_version" >> "$GITHUB_OUTPUT"
          echo "Version: v$cargo_version"

      # The tag of each release has the name of the release. An API error stops the run.
      - name: Make sure that the stable version is new
        if: env.STABLE == 'true'
        id: tag
        env:
          VERSION: ${{ steps.stable.outputs.version }}
        run: |
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" --jq '.[].ref')"
          if grep -qx "refs/tags/$VERSION" <<< "$tags"; then
            if [ "$REPLACE" = true ]; then
              echo "::warning::The tag $VERSION is already on GitHub. The run replaces it."
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::The tag $VERSION is already on GitHub. Increase the version in Cargo.toml, or set the input replace."
              exit 1
            fi
          fi

      - name: Find the version
        id: version
        env:
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
        run: |
          if [ "$STABLE" = true ]; then
            version="$STABLE_VERSION"
          else
            version="pre-${GITHUB_SHA::7}"
            if gh release view "$version" > /dev/null 2>&1; then
              echo "::notice::The release $version is already on GitHub."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  # The images, the icon and the videos must be the same as the files in git.
  media:
    # An arm64 runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # images: the design images and the icon. installer: images/install-*.png. video: the demo videos.
        part: [images, installer, video]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        if: matrix.part != 'installer'
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Writes the files of this part into the checkout.
      - name: Make the ${{ matrix.part }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.part }}
          platforms: linux/arm64
          outputs: type=local,dest=.
          cache-from: type=gha,scope=media-${{ matrix.part }}
          cache-to: type=gha,scope=media-${{ matrix.part }},mode=max

      - name: Compare with the files in git
        env:
          PART: ${{ matrix.part }}
        run: |
          changes="$(git status --porcelain -- images video appload/sudoku/icon.png)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The files are not the same as the output of Dockerfile.$PART. Make them again with make media (Docker) and commit them."
            exit 1
          fi

  # All tests on aarch64 Linux with musl, the C library of the tablet.
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # release: cargo test --release. debug: cargo test, with the checks of INVARIANTS.md after each input.
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache keeps the compiled dependencies between runs.
      - name: Run the ${{ matrix.profile }} tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.test
          target: ${{ matrix.profile }}
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=test-${{ matrix.profile }}
          cache-to: type=gha,scope=test-${{ matrix.profile }},mode=max

  # The AppLoad folder with the version of the release. The job release publishes it.
  build:
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache keeps the compiled dependencies between runs.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=dist
          build-args: SUDOKU_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

      # An artifact does not keep the file modes. The tar file keeps the mode 755 of the executable.
      - name: Keep the AppLoad folder
        run: tar -C dist -cf dist.tar sudoku

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar
          retention-days: 1
          if-no-files-found: error

  # When the images, the videos, all tests and the build pass: the release.
  release:
    needs: [version, media, test, build]
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'release-stable' || format('release-pre-{0}', github.sha) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Open the AppLoad folder
        run: |
          mkdir dist
          tar -C dist -xf dist.tar
          rm dist.tar

      - name: Make the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.SUDOKU_SIGNING_KEY }}
          REPLACE_OLD: ${{ needs.version.outputs.replace }}
        run: |
          # The ink patch is a separate file of the release (REQUIREMENTS.md §9.2, §14.6). The
          # installer and the app download it, and do not read it from the archive.
          patch=sudoku-penregion.qmd
          mv "dist/sudoku/$patch" "$patch"
          patch_sha256="$(sha256sum "$patch" | cut -d ' ' -f 1)"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          archive="sudoku-$VERSION.tar.gz"
          tar -C dist -czf "$archive" sudoku
          sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          jq -n --arg version "$VERSION" --arg url "$base/$archive" --arg sha256 "$sha256" \
            --arg patch_url "$base/$patch" --arg patch_sha256 "$patch_sha256" \
            '{version: $version, url: $url, sha256: $sha256, patch_url: $patch_url, patch_sha256: $patch_sha256}' > version.json
          cat version.json
          # install.sh of this release installs this archive and this patch (REQUIREMENTS.md §14.6).
          mkdir -p installer
          sed -e "s/@SUDOKU_VERSION@/$VERSION/" -e "s/@SUDOKU_SHA256@/$sha256/" -e "s/@SUDOKU_PATCH_SHA256@/$patch_sha256/" \
            install.sh > installer/install.sh
          if grep -q '@SUDOKU_' installer/install.sh; then
            echo "::error::install.sh still has a placeholder."
            exit 1
          fi
          files=("$archive" "$patch" version.json installer/install.sh)
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/signing-key.pem"
            (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
            openssl pkeyutl -sign -inkey "$key" -rawin -in version.json -out version.json.sig
            rm -f "$key"
            files+=(version.json.sig)
          elif [ "$STABLE" = true ]; then
            echo "::error::The secret SUDOKU_SIGNING_KEY is not set. A stable release must have version.json.sig."
            exit 1
          else
            echo "::warning::The secret SUDOKU_SIGNING_KEY is not set. The prerelease has no version.json.sig."
          fi
          # Delete the old release only now, after the new build passes all tests.
          if [ "$REPLACE_OLD" = true ]; then
            if gh release view "$VERSION" > /dev/null 2>&1; then
              gh release delete "$VERSION" --cleanup-tag --yes
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
            fi
          fi
          if [ "$STABLE" = true ]; then kind=--latest; else kind=--prerelease; fi
          gh release create "$VERSION" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes "$kind"

# Tests, builds and releases the app for the reMarkable Paper Pro. One workflow, two push events:
#
# - A push to main makes the prerelease `pre-<sha>` (a preview version).
# - A push of a valid version tag makes the stable release with the name of the tag. A valid version
#   tag has the form `v<major>.<minor>.<patch>` and agrees with the version in Cargo.toml. If the
#   release of the tag is already on GitHub, the run fails. A rerun of the workflow replaces the old
#   release, after the new build passes all tests. Only one stable release can operate at a time.
#
# The jobs version, media, test and build run in parallel (build starts after version). The job
# release starts only when all of them pass:
#
# 1. version: finds and examines the name of the release. A version tag makes a stable release, and
#    its release must be new.
# 2. media: Dockerfile.images, Dockerfile.installer and Dockerfile.video make the images, the
#    AppLoad icon and the demo videos again (one job for each Dockerfile). They must be the same as
#    the files in git.
# 3. test: Dockerfile.test runs all tests on aarch64 Linux (musl). The release tests and the debug
#    tests are two jobs.
# 4. build: the Dockerfile builds the AppLoad folder dist/sudoku/ with the version of the release.
# 5. release: makes a GitHub release with the AppLoad folder (sudoku-<version>.tar.gz),
#    version.json, version.json.sig and install.sh. The archive has all files of the app folder
#    (REQUIREMENTS.md §14.4), with the mode 755 of `sudoku` and of `backend/entry`. A release has no
#    ink patch file (owner decision 2026-11-12). install.sh has the version and the checksum of the
#    archive of its release. version.json gives the version, the download URL and the SHA-256
#    checksum of the archive. version.json.sig is the ed25519 signature of version.json with the private key in the
#    secret SUDOKU_SIGNING_KEY (PEM). The app installs an update only with a correct signature
#    (REQUIREMENTS.md §9.2). A stable release fails without the secret.
name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

# A new push to main cancels the run of an older push. A tag push does not cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  version:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
      replace: ${{ steps.tag.outputs.replace }}
    env:
      GH_TOKEN: ${{ github.token }}
      # True for a version tag push (a stable release), false for a push to main (a prerelease).
      STABLE: ${{ github.ref_type == 'tag' }}
      # A rerun replaces an old release of the same tag, after all tests pass.
      REPLACE: ${{ github.run_attempt > 1 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A version tag has the form v<major>.<minor>.<patch> (src/update.rs, parse_version). The
      # version in Cargo.toml gives the version of the build, thus the two must agree.
      - name: Find the stable version
        if: env.STABLE == 'true'
        id: stable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $TAG is not a valid version tag (v<major>.<minor>.<patch>)."
            exit 1
          fi
          # tomllib is the TOML parser of the Python standard library (Python 3.11 and later).
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$TAG" != "v$cargo_version" ]; then
            echo "::error::The tag $TAG does not agree with the version v$cargo_version in Cargo.toml. Make a new version with make bump-patch|minor|major and push the new tag."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

      # The release of a version tag that is already on GitHub is an error, unless this is a rerun.
      - name: Make sure that the stable release is new
        if: env.STABLE == 'true'
        id: tag
        env:
          VERSION: ${{ steps.stable.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            if [ "$REPLACE" = true ]; then
              echo "::warning::The release $VERSION is already on GitHub. The run replaces it."
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::The release $VERSION is already on GitHub. Rerun the workflow to replace it."
              exit 1
            fi
          fi

      - name: Find the version
        id: version
        env:
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
        run: |
          if [ "$STABLE" = true ]; then
            version="$STABLE_VERSION"
          else
            version="pre-${GITHUB_SHA::7}"
            if gh release view "$version" > /dev/null 2>&1; then
              echo "::notice::The release $version is already on GitHub."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  # The images, the icon and the videos must be the same as the files in git.
  media:
    # An arm64 runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # images: the design images and the icon. installer: images/install-*.png. video: the demo videos.
        part: [images, installer, video]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        if: matrix.part != 'installer'
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Writes the files of this part into the checkout.
      - name: Make the ${{ matrix.part }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.part }}
          platforms: linux/arm64
          outputs: type=local,dest=.
          cache-from: type=gha,scope=media-${{ matrix.part }}
          cache-to: type=gha,scope=media-${{ matrix.part }},mode=max

      - name: Compare with the files in git
        env:
          PART: ${{ matrix.part }}
        run: |
          changes="$(git status --porcelain -- images video appload/sudoku/icon.png)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The files are not the same as the output of Dockerfile.$PART. Make them again with make media (Docker) and commit them."
            exit 1
          fi

  # All tests on aarch64 Linux with musl, the C library of the tablet.
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # release: cargo test --release. debug: cargo test, with the checks of INVARIANTS.md after each input.
        profile: [release, debug]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache keeps the compiled dependencies between runs.
      - name: Run the ${{ matrix.profile }} tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.test
          target: ${{ matrix.profile }}
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=test-${{ matrix.profile }}
          cache-to: type=gha,scope=test-${{ matrix.profile }},mode=max

  # The AppLoad folder with the version of the release. The job release publishes it.
  build:
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache keeps the compiled dependencies between runs.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=dist
          build-args: SUDOKU_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

      # An artifact does not keep the file modes. The tar file keeps the mode 755 of `sudoku` and of
      # `backend/entry`.
      - name: Keep the AppLoad folder
        run: tar -C dist -cf dist.tar sudoku

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar
          retention-days: 1
          if-no-files-found: error

  # When the images, the videos, all tests and the build pass: the release.
  release:
    needs: [version, media, test, build]
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ${{ github.ref_type == 'tag' && 'release-stable' || format('release-pre-{0}', github.sha) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Open the AppLoad folder
        run: |
          mkdir dist
          tar -C dist -xf dist.tar
          rm dist.tar

      - name: Make the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.SUDOKU_SIGNING_KEY }}
          REPLACE_OLD: ${{ needs.version.outputs.replace }}
        run: |
          # The app folder of a release has exactly these files (REQUIREMENTS.md §14.4, LCH-6). The
          # two programs keep the mode 755 in the archive: the update of a release before the
          # frontend sets the mode only for `sudoku`. A release has no ink patch file.
          want="backend/entry external.manifest.json icon.png manifest.json resources.rcc sudoku"
          have="$(cd dist/sudoku && find . -type f | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "${have% }" != "$want" ]; then
            echo "::error::dist/sudoku has the files: $have. It must have: $want."
            exit 1
          fi
          for program in sudoku backend/entry; do
            if [ "$(stat -c %a "dist/sudoku/$program")" != 755 ]; then
              echo "::error::dist/sudoku/$program does not have the mode 755."
              exit 1
            fi
          done
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          archive="sudoku-$VERSION.tar.gz"
          tar -C dist -czf "$archive" sudoku
          sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          # The format of version.json: REQUIREMENTS.md §9.2 (owner approval 2026-11-12).
          jq -n --arg version "$VERSION" --arg url "$base/$archive" --arg sha256 "$sha256" \
            '{version: $version, url: $url, sha256: $sha256}' > version.json
          cat version.json
          # install.sh of this release installs this archive (REQUIREMENTS.md §14.6).
          mkdir -p installer
          sed -e "s/@SUDOKU_VERSION@/$VERSION/" -e "s/@SUDOKU_SHA256@/$sha256/" \
            install.sh > installer/install.sh
          if grep -q '@SUDOKU_' installer/install.sh; then
            echo "::error::install.sh still has a placeholder."
            exit 1
          fi
          files=("$archive" version.json installer/install.sh)
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/signing-key.pem"
            (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
            openssl pkeyutl -sign -inkey "$key" -rawin -in version.json -out version.json.sig
            rm -f "$key"
            files+=(version.json.sig)
          elif [ "$STABLE" = true ]; then
            echo "::error::The secret SUDOKU_SIGNING_KEY is not set. A stable release must have version.json.sig."
            exit 1
          else
            echo "::warning::The secret SUDOKU_SIGNING_KEY is not set. The prerelease has no version.json.sig."
          fi
          # Delete the old release only now, after the new build passes all tests. Keep the tag: it
          # started this run.
          if [ "$REPLACE_OLD" = true ] && gh release view "$VERSION" > /dev/null 2>&1; then
            gh release delete "$VERSION" --yes
          fi
          if [ "$STABLE" = true ]; then kind=--latest; else kind=--prerelease; fi
          # A stable release uses the version tag of this run. A prerelease makes its tag.
          target=()
          if [ "$STABLE" != true ]; then target=(--target "$GITHUB_SHA"); fi
          gh release create "$VERSION" "${files[@]}" "${target[@]}" \
            --title "$VERSION" --generate-notes "$kind"

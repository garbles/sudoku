# Builds the app and makes a GitHub release with the AppLoad folder (sudoku-<version>.tar.gz).
#
# - build.yml calls this workflow after each push to main. The result is the prerelease `pre-<sha>`.
# - A manual run (workflow_dispatch) on main makes the stable release `stable-<n>`. The number n is
#   1 more than the largest number of the stable-* tags. Only one stable run can operate at a time.
name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    # In a called workflow, github.event_name is the event of the caller (push).
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'release-stable' || format('release-pre-{0}', github.sha) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Stable releases only from main
        if: env.STABLE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start the stable release from the main branch."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the version
        id: version
        run: |
          if [ "$STABLE" = true ]; then
            last="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/stable-" --jq '.[].ref' \
              | sed -n 's|^refs/tags/stable-\([0-9][0-9]*\)$|\1|p' | sort -n | tail -n 1)"
            version="stable-$(( ${last:-0} + 1 ))"
          else
            version="pre-${GITHUB_SHA::7}"
          fi
          if gh release view "$version" > /dev/null 2>&1; then
            echo "::notice::The release $version is already on GitHub."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.exists != 'true'

      # The Dockerfile runs all tests before it makes dist/sudoku/. The cache keeps the compiled
      # dependencies between runs.
      - name: Test and build
        if: steps.version.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=dist
          build-args: SUDOKU_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

      - name: Make the release
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -C dist -czf "sudoku-$VERSION.tar.gz" sudoku
          if [ "$STABLE" = true ]; then kind=--latest; else kind=--prerelease; fi
          gh release create "$VERSION" "sudoku-$VERSION.tar.gz" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes "$kind"

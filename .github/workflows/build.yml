# Runs all tests and builds the app for the reMarkable Paper Pro on each push to main.
# The Dockerfile runs the tests on aarch64 Linux and makes the AppLoad folder dist/sudoku/.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # An arm64 runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tests and static aarch64 build. The cache keeps the compiled dependencies between runs.
      - name: Test and build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: sudoku
          path: dist/sudoku/
          if-no-files-found: error

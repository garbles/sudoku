# Runs all tests and builds the app for the reMarkable Paper Pro on each push to main.
# Dockerfile.imagegen makes the images and the demo video again. They must be the same as the files in git.
# Then release.yml runs the tests on aarch64 Linux, builds the app and makes the prerelease pre-<sha>.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    # An arm64 runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git does not contain the reMarkable Sans font (refer to scripts/fonts/README.md).
      - name: Write the fonts
        env:
          FONT_REGULAR: ${{ secrets.SUDOKU_FONT_REGULAR }}
          FONT_MEDIUM: ${{ secrets.SUDOKU_FONT_MEDIUM }}
        run: |
          if [ -z "$FONT_REGULAR" ] || [ -z "$FONT_MEDIUM" ]; then
            echo "::error::The secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM are not set (refer to AGENTS.md)."
            exit 1
          fi
          printf '%s' "$FONT_REGULAR" | base64 -d | gunzip > scripts/fonts/rmsans-400.ttf
          printf '%s' "$FONT_MEDIUM" | base64 -d | gunzip > scripts/fonts/rmsans-500.ttf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Writes images/*.png, video/demo.mp4 and video/demo.gif into the checkout.
      - name: Make the images and the video
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.imagegen
          platforms: linux/arm64
          outputs: type=local,dest=.
          cache-from: type=gha,scope=media
          cache-to: type=gha,scope=media,mode=max

      - name: Compare with the files in git
        run: |
          changes="$(git status --porcelain -- images video)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The images or the video are not the same as the output of Dockerfile.imagegen. Make them again with Dockerfile.imagegen and commit them."
            exit 1
          fi

  # When the images and the video are correct, release.yml runs all tests, builds the app and makes
  # the prerelease pre-<sha>.
  prerelease:
    needs: media
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # release.yml signs version.json with the secret SUDOKU_SIGNING_KEY and writes the fonts from
    # the secrets SUDOKU_FONT_REGULAR and SUDOKU_FONT_MEDIUM.
    secrets: inherit

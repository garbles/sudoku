# Runs all tests and builds the app for the reMarkable Paper Pro on each push to main.
# The Dockerfile runs the tests on aarch64 Linux and makes the AppLoad folder dist/sudoku/.
# Dockerfile.imagegen makes the images and the demo video again. They must be the same as the files in git.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # An arm64 runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tests and static aarch64 build. The cache keeps the compiled dependencies between runs.
      - name: Test and build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

  media:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Writes images/*.png, video/demo.mp4 and video/demo.gif into the checkout.
      - name: Make the images and the video
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.imagegen
          platforms: linux/arm64
          outputs: type=local,dest=.
          cache-from: type=gha,scope=media
          cache-to: type=gha,scope=media,mode=max

      - name: Compare with the files in git
        run: |
          changes="$(git status --porcelain -- images video)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The images or the video are not the same as the output of Dockerfile.imagegen. Make them again with Dockerfile.imagegen and commit them."
            exit 1
          fi

[package]
name = "rm-sudoku"
version = "0.2.2"
edition = "2021"
description = "Sudoku for the reMarkable Paper Pro (AppLoad external app with qtfb)"
license = "MIT"

[lib]
name = "sudoku"
path = "src/lib.rs"

[[bin]]
name = "sudoku"
path = "src/bin/sudoku.rs"

[[bin]]
name = "snapshot"
path = "src/bin/snapshot.rs"

[[bin]]
name = "video"
path = "src/bin/video.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[features]
# The corpus build (a development build only): a blank board, and each ink goes to a log with its
# cell. It collects handwriting examples for the recognizer (src/corpus.rs, the skill
# `remarkable-corpus`). Do not use it for a release.
corpus = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
png = "0.17"
wuff = "0.2"
libc = "0.2"
sha2 = "0.11"
ed25519-dalek = "3"
flate2 = "1"
tar = "0.4"

# The malloc of musl (the C library of the tablet build) is slow.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3"

# The fast tablet build of Dockerfile.dev (make install-dev). No LTO, many codegen units and
# incremental compilation. The opt-level is the same as in the release build.
[profile.tablet-dev]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
